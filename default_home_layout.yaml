- title: Technology
  id: technology_videos
  feedSources:
    - id: inv_search_technology_videos
      title: Technology
      apiType: Invidious
      endpoint: search
      queryParams:
        q: (@JeffGeerling OR @AZisk OR @HardwareHaven OR @LinusTechTips OR @JeffSu OR @KyleErickson OR @NetworkChuck OR @CoreDumpped)
        type: video
        sort: relevance

