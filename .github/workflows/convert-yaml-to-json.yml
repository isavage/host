name: Convert YAML to JSON

on:
  push:
    branches:
      - vTube
    paths:
      - 'default_home_layout.yaml'

# Set permissions for GITHUB_TOKEN to write
permissions:
  contents: write

jobs:
  convert-yaml-to-json:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout vTube branch
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GHA_PAT }}
        ref: vTube
        
    - name: Install dependencies
      run: |
        # Install yq for YAML to JSON conversion
        sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
        sudo chmod +x /usr/bin/yq
        
        # Install jq for JSON validation (optional but helpful)
        sudo apt-get update
        sudo apt-get install -y jq
        
    - name: Convert YAML to JSON
      id: convert
      run: |
        echo "Converting default_home_layout.yaml to JSON..."
        
        # Validate YAML file exists
        if [ ! -f "default_home_layout.yaml" ]; then
          echo "Error: default_home_layout.yaml not found!"
          exit 1
        fi
        
        # First, check if YAML is valid
        echo "Checking YAML syntax..."
        if ! yq e '.' default_home_layout.yaml > /dev/null 2>&1; then
          echo "Error: YAML file is invalid!"
          exit 1
        fi
        
        # Convert YAML to JSON
        echo "Converting to JSON..."
        yq -o=json default_home_layout.yaml > default_home_layout_new.json
        
        # Check if conversion succeeded
        if [ $? -ne 0 ]; then
          echo "Error: Failed to convert YAML to JSON!"
          exit 1
        fi
        
        # Validate JSON syntax using jq (more reliable)
        echo "Validating JSON..."
        if ! jq empty default_home_layout_new.json 2>/dev/null; then
          echo "Error: Generated JSON is invalid!"
          echo "JSON content:"
          cat default_home_layout_new.json
          exit 1
        fi
        
        # Check if JSON already exists and is different
        if [ -f "default_home_layout.json" ]; then
          if cmp -s default_home_layout_new.json default_home_layout.json; then
            echo "✅ No changes to JSON file."
            echo "changed=false" >> $GITHUB_OUTPUT
            rm default_home_layout_new.json
          else
            echo "🔄 JSON file has changed."
            echo "changed=true" >> $GITHUB_OUTPUT
            mv default_home_layout_new.json default_home_layout.json
          fi
        else
          echo "✨ Creating new JSON file."
          echo "changed=true" >> $GITHUB_OUTPUT
          mv default_home_layout_new.json default_home_layout.json
        fi
        
        echo "✅ Conversion successful!"
        
    - name: Configure Git identity
      if: steps.convert.outputs.changed == 'true'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
    - name: Commit and push JSON changes
      if: steps.convert.outputs.changed == 'true'
      run: |
        # Add and commit the JSON file
        git add default_home_layout.json
        git commit -m "Auto-convert: Update JSON from YAML [skip ci]"
        
        # Push using the authenticated remote
        git push origin HEAD:vTube
        
    - name: Show conversion status
      if: always()
      run: |
        if [ "${{ steps.convert.outputs.changed }}" = "true" ]; then
          echo "✅ JSON file was updated and committed."
        elif [ "${{ steps.convert.outputs.changed }}" = "false" ]; then
          echo "ℹ️  JSON file was already up-to-date."
        else
          echo "❌ Conversion failed or was skipped."
        fi
