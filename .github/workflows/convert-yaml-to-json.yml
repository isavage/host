name: Convert YAML to JSON

on:
  push:
    branches:
      - vTube
    paths:
      - 'default_home_layout.yaml'

jobs:
  convert-yaml-to-json:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout vTube branch
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GHA_PAT }}
        ref: vTube
        persist-credentials: true  # This is key!
        
    - name: Install yq
      run: |
        sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
        sudo chmod +x /usr/bin/yq
        
    - name: Convert YAML to JSON
      id: convert
      run: |
        echo "Converting default_home_layout.yaml to JSON..."
        yq -o=json default_home_layout.yaml > default_home_layout.json
        
        # Validate
        python3 -c "import json; json.load(open('default_home_layout.json'))" && echo "✅ JSON syntax is valid"
        
        # Check if different from previous commit
        if git diff --quiet HEAD -- default_home_layout.json; then
          echo "✅ No changes to JSON file."
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "🔄 JSON file has changed."
          echo "changed=true" >> $GITHUB_OUTPUT
        fi
        
    - name: Commit and push
      if: steps.convert.outputs.changed == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add default_home_layout.json
        git commit -m "Auto-convert: Update JSON from YAML [skip ci]"
        git push
